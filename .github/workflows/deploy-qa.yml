name: Deploy to QA

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Files
        run: |
          ls -R

      - name: Get OAuth Token
        run: |
          curl -X POST "${{ secrets.QA_TOKEN_URL }}" \
          -u "${{ secrets.QA_CLIENT_ID }}:${{ secrets.QA_CLIENT_SECRET }}" \
          -d "grant_type=client_credentials"
