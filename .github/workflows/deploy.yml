name: CPI Authentication Test

on:
  workflow_dispatch:

jobs:
  test-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Get OAuth Token
        run: |
          RESPONSE=$(curl -s --request POST \
            --url "${{ secrets.DEV_TOKEN_URL }}" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data "grant_type=client_credentials" \
            --data "client_id=${{ secrets.DEV_CLIENT_ID }}" \
            --data "client_secret=${{ secrets.DEV_CLIENT_SECRET }}")

          echo "$RESPONSE"
